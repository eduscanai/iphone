# Testes automáticos de cada componente (guia, seção 17.1).
name: testes
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morecheck_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/morecheck_teste
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  visao:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visao
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen
      - run: uv run pytest -q

  painel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  ios-nucleo:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app-ios/Pacotes/CabineNucleo
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/cabine-luz
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cp include/segredos.exemplo.h include/segredos.h
      - run: uvx --from platformio pio run
