# Projeto do app (xcodegen). STUB: no repositório real, os arquivos de Sources/Cabine e
# Sources/Estetica entram no project.yml existente do app Morecheck.
name: Morecheck
options:
  bundleIdPrefix: com.morecheck
  deploymentTarget:
    iOS: "17.0"
packages:
  CabineNucleo:
    path: Pacotes/CabineNucleo
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  Morecheck:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["App/Info-Debug.plist"]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: CabineNucleo
    settings:
      configs:
        # Debug libera HTTP para qualquer endereço (testes com o backend do Mac por IP; o iOS 17+
        # bloqueia IP mesmo com NSAllowsLocalNetworking). Release continua restrito à rede local .local.
        Debug:
          INFOPLIST_FILE: Sources/App/Info-Debug.plist
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "A cabine fotografa o aparelho avaliado para a nota estética."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "A cabine controla as luzes pela rede local."
    info:
      path: Sources/App/Info.plist
      properties:
        NSBonjourServices: [_http._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
