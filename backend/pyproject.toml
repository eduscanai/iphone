[project]
name = "morecheck-backend"
version = "0.1.0"
description = "Backend Morecheck — módulo da nota estética (desenvolvimento autônomo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "fastapi>=0.143.2",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.0",
    "pytest>=9.1.1",
]
