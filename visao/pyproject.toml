[project]
name = "visao"
version = "0.1.0"
description = "Pipeline de visão da nota estética (Morecheck)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-contrib-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "rawpy>=0.27.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
# Exportar dados do banco e do storage (fase 4).
dados = ["psycopg[binary]>=3.2", "boto3>=1.35"]
# Treino e inferência das camadas (b) e (c). Pesado (PyTorch): só no Mac/GPU que treina (D6).
# VERIFICAR as versões e as licenças (guia 18) antes de instalar.
treino = ["rfdetr[train]>=1.11", "anomalib>=2.7", "torch>=2.5"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
